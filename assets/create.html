{% extends "admin/challenges/create.html" %}

{% block header %}
<div class="alert alert-secondary" role="alert">
    Geographic challenges require users to find a specific location on a map. Points are awarded based on how close they get to the target location.
</div>
{% endblock %}

{% block value %}

<style>
    #map-create {
        height: 400px;
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 15px;
        z-index: 1;
    }
</style>

<div class="form-group">
    <label for="value">Value<br>
        <small class="form-text text-muted">
            Points awarded for finding the correct location
        </small>
    </label>
    <input type="number" class="form-control" name="value" placeholder="Enter value" required>
</div>

<div class="form-group">
    <label>Answer type<br>
        <small class="form-text text-muted">
            Choose how the solution is defined.
        </small>
    </label>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="geo_mode" id="geo-mode-point" value="point" checked>
        <label class="form-check-label" for="geo-mode-point">
            Point + tolerance radius <span class="text-muted">(a point counts if within the radius)</span>
        </label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="geo_mode" id="geo-mode-polygon" value="polygon">
        <label class="form-check-label" for="geo-mode-polygon">
            Polygon zone <span class="text-muted">(a point counts if inside the drawn area — e.g. a building)</span>
        </label>
    </div>
</div>

<div class="form-group">
    <label>Location Selection<br>
        <small class="form-text text-muted geo-hint-point">Click on the map to set the target location.</small>
        <small class="form-text text-muted geo-hint-polygon" style="display: none;">Use the polygon tool (top-left of the map) to draw the answer zone, then adjust its vertices.</small>
    </label>
    <div id="map-create"></div>
</div>

<!-- Polygon geometry (JSON array of [lat, lng]); empty in point mode -->
<input type="hidden" name="polygon" id="polygon" value="">

<div class="geo-point-fields">
    <div class="form-group">
        <label for="latitude">Latitude</label>
        <input type="text" class="form-control" name="latitude" id="latitude" required>
    </div>

    <div class="form-group">
        <label for="longitude">Longitude</label>
        <input type="text" class="form-control" name="longitude" id="longitude" required>
    </div>

    <div class="form-group">
        <label for="tolerance_radius">Tolerance Radius (meters)<br>
            <small class="form-text text-muted">
                Users must find a location within this radius to solve the challenge
            </small>
        </label>
        <input type="number" class="form-control" name="tolerance_radius" min="1" value="10" required>
    </div>
</div>

{% endblock %}

{% block type %}
<input type="hidden" value="geo" name="type" id="chaltype">
{% endblock %}
